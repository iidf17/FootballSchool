services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:secretpassword123@db:5432/training_control
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: training_control
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: